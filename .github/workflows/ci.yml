name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Server/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Create isolated CI configuration
        run: |
          node --input-type=module <<'JS'
          import { randomBytes } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          const password = randomBytes(24).toString('hex');
          writeFileSync('.env', [
            'HOST=127.0.0.1', 'PORT=8787',
            `API_TOKEN=${randomBytes(32).toString('hex')}`,
            `POSTGRES_PASSWORD=${password}`,
            `DATABASE_URL=postgres://myapp:${password}@127.0.0.1:55432/myapp`,
            'S3_ENDPOINT=http://127.0.0.1:59000',
            'S3_PUBLIC_ENDPOINT=http://127.0.0.1:59000',
            'S3_ACCESS_KEY=murmur-ci',
            `S3_SECRET_KEY=${randomBytes(32).toString('hex')}`,
            'S3_BUCKET=murmur-ci', 'S3_REGION=us-east-1',
          ].join('\n') + '\n', { mode: 0o600 });
          JS
      - run: docker compose up -d --wait --wait-timeout 120
      - run: npm run db:migrate
      - name: Initialize S3
        run: |
          for attempt in $(seq 1 30); do
            if npm run storage:init; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npm run typecheck
      - run: npm test
      - name: Check generated client matches contract
        run: |
          npm run codegen
          git diff --exit-code -- openapi ../Client/api
      - name: Start API and test Kotlin client
        run: |
          npm start > /tmp/murmur-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health > /dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          npm run test:kotlin
      - name: Stop development services
        if: always()
        run: docker compose down
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build and verify Android
        working-directory: Client
        run: sh gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: murmur-debug-apk
          path: Client/app/build/outputs/apk/debug/app-debug.apk
