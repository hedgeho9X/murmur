<!doctype html>
<!-- Murmur 的独立交互原型：呈现取景、录音演示和草稿编辑，不连接业务后端。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Murmur</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="phone">
      <header>
        <button id="history" class="icon-button" aria-label="查看记录">
          <svg viewBox="0 0 24 24">
            <path d="M5 5h14M5 12h10M5 19h14" />
          </svg></button
        ><span class="brand">Murmur</span
        ><button id="resume" class="icon-button" aria-label="打开草稿">
          <svg viewBox="0 0 24 24">
            <path d="M14 5H5v15h15v-9M12 13l1-4 7-7 3 3-7 7-4 1Z" /></svg
          ><span id="draft-dot" hidden></span>
        </button>
      </header>
      <section id="capture-view">
        <div id="viewfinder" class="viewfinder">
          <img id="scene" src="scene.svg" alt="相机演示占位画面" />
          <video id="camera" autoplay playsinline muted hidden></video>
          <img id="capture-photo" alt="已拍摄的照片" hidden />
          <button
            id="enable-camera"
            class="camera-enable"
            aria-label="启用真实相机"
          >
            <svg viewBox="0 0 24 24">
              <path d="M4 7h4l2-3h4l2 3h4v13H4Z" />
              <circle cx="12" cy="13" r="4" />
            </svg>
          </button>
          <div id="recording-panel" hidden>
            <div class="record-top">
              <span><i></i> 模拟</span><time id="timer">00:00</time>
            </div>
            <div class="live-copy">
              <span id="live-text" aria-live="polite"></span
              ><span class="cursor"></span>
            </div>
            <div class="wave" id="wave" aria-hidden="true"></div>
          </div>
          <span id="photo-count" hidden>1 张照片</span><span id="flash"></span>
        </div>
        <div id="shutter-controls" class="controls">
          <button
            id="shutter"
            class="shutter"
            aria-label="点按拍照，长按直接录音"
          >
            <span></span>
          </button>
        </div>
        <div id="photo-controls" class="controls" hidden>
          <div class="button-pair">
            <button id="record" class="record-button" aria-label="开始录音">
              <span></span></button
            ><button id="edit" class="edit-button" aria-label="编辑文字">
              <svg viewBox="0 0 24 24">
                <path d="m4 16 12-12 4 4L8 20H4v-4ZM13 7l4 4" />
              </svg>
            </button>
          </div>
          <button id="retake" class="icon-button retake" aria-label="重新取景">
            <svg viewBox="0 0 24 24">
              <path d="M4 9a8 8 0 1 1 0 7M4 3v6h6" />
            </svg>
          </button>
        </div>
        <div id="record-controls" class="controls" hidden>
          <button id="stop" class="stop-button" aria-label="停止录音">
            <span></span>
          </button>
        </div>
      </section>
      <section id="history-view" hidden>
        <div class="intro">
          <h1>我的记录</h1>
        </div>
        <div id="post-list"></div>
        <button id="back-capture" class="return-button" aria-label="新增记录">
          ＋
        </button>
      </section>
      <div id="toast" role="status" hidden></div>
      <div id="scrim" hidden></div>
      <section
        id="editor"
        class="editor"
        role="dialog"
        aria-modal="true"
        aria-labelledby="editor-title"
        hidden
      >
        <div class="editor-header">
          <h2 id="editor-title" class="sr-only">编辑记录</h2>
          <span id="save-state" class="sr-only" role="status">草稿已保存</span
          ><button
            id="close-editor"
            class="icon-button"
            aria-label="收起编辑器"
          >
            ×
          </button>
        </div>
        <div id="attachments" class="attachments"></div>
        <textarea
          id="body"
          placeholder="现在的想法是…"
          aria-label="记录正文"
        ></textarea>
        <div class="editor-toolbar">
          <div>
            <button id="add-image" class="icon-button" aria-label="添加图片">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="3" />
                <path d="m4 17 5-5 4 4 3-3 5 5" />
                <circle cx="15.5" cy="8.5" r="1.5" />
              </svg>
            </button>
          </div>
          <button id="send" aria-label="保存到本地记录">
            <svg viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6" /></svg>
          </button>
        </div>
      </section>
      <input id="image-input" type="file" accept="image/*" multiple hidden />
    </main>
    <script src="app.js"></script>
  </body>
</html>
